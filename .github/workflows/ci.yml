name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.5", "3.6", "3.7", "3.8", "3.9.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: MatteoH2O1999/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "13"

      - name: Install libmemcached headers
        run: sudo apt-get update && sudo apt-get install -y libmemcached-dev zlib1g-dev

      - name: Configure pip index (time-machine)
        run: pip config set global.index-url "https://:2022-04-11T13:28:14.391Z@time-machines-pypi.sealsecurity.io/"

      - name: Downgrade pip and setuptools to 2022-04-11
        run: python -m pip install --upgrade --force-reinstall pip setuptools

      - name: Install tox
        run: python -m pip install --upgrade tox

      - name: Run tox
        run: |
          PY_TAG=$(echo "${{ matrix.python-version }}" | awk -F. '{print $1$2}')
          tox -e py${PY_TAG}

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: MatteoH2O1999/setup-python@v1
        with:
          python-version: "3.9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "13"

      - name: Configure pip index (time-machine)
        run: pip config set global.index-url "https://:2022-04-11T13:28:14.391Z@time-machines-pypi.sealsecurity.io/"

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Run JavaScript tests
        run: tox -e javascript

  build:
    needs: [test, javascript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: MatteoH2O1999/setup-python@v1
        with:
          python-version: "3.9"

      - name: Configure pip index (time-machine)
        run: pip config set global.index-url "https://:2022-04-11T13:28:14.391Z@time-machines-pypi.sealsecurity.io/"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build wheel

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
